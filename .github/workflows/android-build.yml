name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Repo'ni checkout qilish
        uses: actions/checkout@v4

      - name: Node.js o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: JDK 17 o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: NPM bog'liqliklarni o'rnatish
        run: npm install

      - name: App icon'larni joylashtirish
        run: |
          cp -r app-icon/android-mipmaps/* android/app/src/main/res/ 2>/dev/null || true

      - name: Gradle wrapper'ga ruxsat berish
        run: chmod +x android/gradlew

      - name: Debug APK yig'ish
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Release APK yig'ish (faqat main branch)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Debug APK'ni yuklash
        uses: actions/upload-artifact@v4
        with:
          name: ish-daftarim-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Release APK'ni yuklash
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: ish-daftarim-release-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
